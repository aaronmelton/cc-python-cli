[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_description }}"
authors = ["{{ cookiecutter.author }}"]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
aaron-common-libs = {git = "https://github.com/aaronmelton/aaron-common-libs.git"}
{% if cookiecutter.use_rich_console == "yes" -%}rich = "^13.9.4"{%- endif %}

[tool.poetry.group.dev.dependencies]
bandit = "^1.8.0"
black = "^24.10.0"
coverage = "^7.6.9"
flake8 = "^7.1.1"
isort = "^5.13.2"
pydocstyle = "^6.3.0"
pylint = "^3.3.1"
pytest = "^8.3.3"
pytest-env = "^1.1.5"
flake8-pyproject = "^1.2.3"
mypy = "^1.13.0"
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
skips = ["B108"]
exclude_dirs = ["./tests/"]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
        /(
          \.git
        | \.tox
        | \.venv
        | env/
        | _build
        | build
        | dist
        )/
    '''

[tool.flake8]
ignore = ['E501', 'W503']

[tool.isort]
profile = "black"

[tool.pydocstyle]
convention = '''google'''
inherit = false
match = '''(?!__init__).*\.py'''
match-dir = '''(?!tests)[^\.].*'''

[tool.pylint.master]
init-hook = 'import os, sys; sys.path.append(os.path.dirname("{{ cookiecutter.project_slug }}/"));'

[tool.pylint.messages_control]
disable = '''
    line-too-long,
    singleton-comparison,
    too-many-lines,
    use-implicit-booleaness-not-comparison
    '''

[tool.pylint.miscellaneous]
notes = ''',
    TODO.md,
    '''

[tool.pytest.ini_options]
pythonpath = [".", "{{ cookiecutter.project_slug }}/"]
env = ["LOG_LEVEL = DEBUG",
    "LOG_PATH = /tmp/",
    "API_KEY = test-s3cr3tk3y"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
